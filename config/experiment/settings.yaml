fs_hz: 1000              # referencia; cada sesión usa su fs estimada
n_channels: 4
channel_names: [EMG1, EMG2, EMG3, EMG4]
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  analysis: data/analysis

preprocessing:
  remove_dc: true
  notch_hz: 60
  notch_q: 30
  bandpass_hz: [20, 450]
  bandpass_order: 4

# Segundos que se recortan dentro de cada intervalo del protocolo.
# Valores iniciales: se ajustan con scripts/inspect_margins.py (Paso 4).
margins:
  Gesto:  {onset_s: 0.5,  offset_s: 0.0}
  Reposo: {onset_s: 2.25, offset_s: 0.5}